<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Beautiful Image Slider</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-purple-950 to-slate-900 flex items-center justify-center p-5">

    <!-- Background decoration -->
    <div class="fixed top-10 left-10 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl"></div>
    <div class="fixed bottom-10 right-10 w-52 h-52 bg-blue-500/20 rounded-full blur-3xl"></div>

    <!-- Main Slider -->
    <main id="main"
        class="relative w-full max-w-4xl p-6 sm:p-10 
               bg-white/10 backdrop-blur-xl
               border border-white/20
               rounded-3xl shadow-2xl">

        <!-- Heading -->
        <div class="text-center mb-8">
            <p class="text-purple-300 uppercase tracking-[0.3em] text-sm font-semibold mb-2">
                Gallery
            </p>

            <h1 class="text-3xl sm:text-5xl font-bold text-white">
                Beautiful Moments
            </h1>

            <p class="text-gray-300 mt-3">
                Explore the collection using the buttons below
            </p>
        </div>


        <!-- Image Area -->
        <div id="images"
            class="flex items-center justify-center gap-3 sm:gap-6">

            <!-- Previous Button -->
            <button id="btn1"
                class="group shrink-0 w-12 h-12 sm:w-14 sm:h-14
                       flex items-center justify-center
                       rounded-full
                       bg-white/10
                       border border-white/20
                       text-white text-xl
                       shadow-lg
                       hover:bg-purple-600
                       hover:scale-110
                       active:scale-95
                       transition-all duration-300">

                <span class="group-hover:-translate-x-1 transition-transform">
                    ←
                </span>
            </button>


            <!-- Image Card -->
            <div class="relative flex-1 max-w-2xl">

                <div class="absolute inset-0 bg-purple-500/20 blur-2xl rounded-3xl"></div>

                <div class="relative overflow-hidden rounded-2xl
                            border border-white/20
                            bg-black/20
                            shadow-2xl">

                    <img
                        src=""
                        id="img"
                        class="w-full h-64 sm:h-80 md:h-96
                               object-cover
                               transition-all duration-500
                               hover:scale-105"
                        alt="Gallery image"
                    >

                    <!-- Image overlay -->
                    <div class="absolute inset-x-0 bottom-0
                                bg-gradient-to-t from-black/70 to-transparent
                                p-5">

                        <p class="text-white font-semibold text-lg">
                            Discover Something Beautiful ✨
                        </p>

                    </div>
                </div>
            </div>


            <!-- Next Button -->
            <button id="btn2"
                class="group shrink-0 w-12 h-12 sm:w-14 sm:h-14
                       flex items-center justify-center
                       rounded-full
                       bg-white/10
                       border border-white/20
                       text-white text-xl
                       shadow-lg
                       hover:bg-purple-600
                       hover:scale-110
                       active:scale-95
                       transition-all duration-300">

                <span class="group-hover:translate-x-1 transition-transform">
                    →
                </span>
            </button>

        </div>


        <!-- Bottom indicator -->
        <div class="flex justify-center mt-8 gap-2">
            <span class="w-8 h-1 rounded-full bg-purple-500"></span>
            <span class="w-2 h-1 rounded-full bg-white/30"></span>
            <span class="w-2 h-1 rounded-full bg-white/30"></span>
            <span class="w-2 h-1 rounded-full bg-white/30"></span>
        </div>

    </main>

    <script src="imageSlider.js"></script>

</body>
</html>
