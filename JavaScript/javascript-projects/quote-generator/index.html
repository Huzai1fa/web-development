<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Quote Generator</title>
</head>

<body class="h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex justify-center items-center">

    <div id="main" class="w-full max-w-md px-4">

        <div id="content"
            class="bg-white/20 backdrop-blur-lg rounded-3xl shadow-2xl p-8 flex flex-col items-center gap-6 border border-white/30">

            <h1 class="text-3xl font-bold text-white text-center">
                 Random Quote Generator
            </h1>

            <button id="btn"
                class="px-6 py-3 bg-yellow-400 hover:bg-yellow-500 text-black font-bold rounded-xl shadow-lg transition duration-300 hover:scale-105 active:scale-95 cursor-pointer">
                Generate Quote
            </button>

            <div id="result"
                class="w-80 h-40 bg-white rounded-2xl shadow-xl border-l-8 border-yellow-400 flex items-center justify-center p-6 text-center">

                <p class="text-2xl font-bold italic text-gray-800">
                    <span class="text-4xl text-yellow-500">❝</span>
                    Click the button to generate a quote.
                    <span class="text-4xl text-yellow-500">❞</span>
                </p>

            </div>

        </div>

    </div>

    <script src="quote.js"></script>

</body>
</html>
