<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

    <main class="max-w-6xl mx-auto p-6">

        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold">
                Personal Finance Tracker
            </h1>

            <p class="text-gray-600 mt-2">
                Track your income and expenses.
            </p>
        </header>

        <!-- Dashboard -->
        <section class="grid md:grid-cols-3 gap-5 mb-8">

            <article class="bg-white rounded-xl shadow p-6">
                <h2 class="text-gray-500">Balance</h2>
                <p id="balance" class="text-3xl font-bold mt-2">$0</p>
            </article>

            <article class="bg-white rounded-xl shadow p-6">
                <h2 class="text-gray-500">Income</h2>
                <p id="income" class="text-3xl font-bold text-green-600 mt-2">$0</p>
            </article>

            <article class="bg-white rounded-xl shadow p-6">
                <h2 class="text-gray-500">Expenses</h2>
                <p id="expense" class="text-3xl font-bold text-red-600 mt-2">$0</p>
            </article>

        </section>

        <!-- Add Transaction -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <h2 class="text-2xl font-semibold mb-6">
                Add Transaction
            </h2>

<form id="transaction-form" class="grid md:grid-cols-2 gap-4">

                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                    class="border rounded-lg p-3"
                />

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    class="border rounded-lg p-3"
                />

                <select
                    id="type"
                    class="border rounded-lg p-3">

                    <option value="">Select Type</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>

                </select>

                <input
                    type="date"
                    id="date"
                    class="border rounded-lg p-3"
                />

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    class="border rounded-lg p-3 md:col-span-2"
                />

                <button
                    type="submit"
                    class="bg-blue-600 text-white rounded-lg p-3 md:col-span-2 hover:bg-blue-700">

                    Add Transaction

                </button>

            </form>

        </section>

        <!-- Search & Filter -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <div class="grid md:grid-cols-2 gap-4">

                <input
                    type="text"
                    id="search"
                    placeholder="Search..."
                    class="border rounded-lg p-3"
                />

                <select
                    id="filter"
                    class="border rounded-lg p-3">

                    <option value="all">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>

                </select>

            </div>

        </section>

        <!-- Transactions -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <h2 class="text-2xl font-semibold mb-6">
                Transactions
            </h2>

            <div id="transaction-list">

                <p   
              id="empty-message"   class="text-gray-500">
                    No transactions yet.
                </p>
  <ul id="transactions"></ul>
            </div>

        </section>
         
      


    </main>

    <script src="expenseTracker.js"></script>

</body>
</html>
