<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>My Todo List</title>

    <style>
        /* Hide browser scrollbars while keeping the page usable */
        html,
        body {
            overflow: hidden;
        }

        body {
            background: #0f1115;
        }

        /* Always-visible styled scrollbar on the right side of the task list */
        #ul {
            height: 320px;
            overflow-y: auto !important;
            scrollbar-width: auto;
            scrollbar-color: #6366f1 #2a2e37;
            padding-right: .4rem;
            overscroll-behavior: contain;
        }

        #ul::-webkit-scrollbar {
            display: block;
            width: 12px;
        }

        #ul::-webkit-scrollbar-track {
            background: #2a2e37;
            border-radius: 8px;
            margin: 4px 0;
        }

        #ul::-webkit-scrollbar-thumb {
            background-color: #6366f1;
            border-radius: 8px;
            border: 2px solid #2a2e37;
            min-height: 40px;
        }

        #ul::-webkit-scrollbar-thumb:hover {
            background-color: #818cf8;
        }

        /* ============= TASK ITEMS (generated by JS, styled here) ============= */

        #ul li {
            display: flex;
            align-items: center;
            gap: .75rem;
            background: #1a1d24;
            border: 1px solid #2a2e37;
            border-radius: .75rem;
            padding: .75rem .9rem;
            transition: border-color .15s ease;
        }

        #ul li:hover {
            border-color: #3f434f;
        }

        #ul li span {
            flex: 1 1 auto;
            min-width: 0;
            word-break: break-word;
            font-size: .95rem;
            line-height: 1.4;
            padding: .3rem .5rem;
            border-radius: .4rem;
            outline: none;
        }

        #ul li span.line-through {
            color: #6b7280;
            text-decoration: line-through;
        }

        #ul li span[contenteditable="true"] {
            background: #14161b;
            border: 1px dashed #4b5563;
            color: #e5e7eb;
        }

        /* Simple checkbox */
        #ul li input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            border: 2px solid #4b5563;
            border-radius: .4rem;
            cursor: pointer;
            position: relative;
            background: #14161b;
            transition: background-color .15s ease, border-color .15s ease;
        }

        #ul li input[type="checkbox"]:hover {
            border-color: #6b7280;
        }

        #ul li input[type="checkbox"]:checked {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        #ul li input[type="checkbox"]:checked::after {
            content: '\2713';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Action buttons created by JS (delete / edit) */
        #ul li button {
            flex-shrink: 0;
            font-size: .75rem;
            padding: .4rem .75rem;
            border-radius: .4rem;
        }

        /* Empty state: show only when the list has no items — pure CSS, no JS change needed */
        #emptyState {
            display: none;
        }

        #ul:empty + #emptyState {
            display: block;
        }

        /* Smooth text editing */
        [contenteditable="true"] {
            cursor: text;
        }
    </style>
</head>


<body class="min-h-screen bg-[#0f1115] text-white flex items-center justify-center p-3 sm:p-5">


    <!-- MAIN APP -->
    <main
        id="main"
        class="w-full max-w-4xl
        max-h-[calc(100vh-24px)]
        sm:max-h-[calc(100vh-40px)]
        bg-[#15171c]
        border border-[#262a33]
        rounded-2xl
        shadow-xl
        overflow-hidden">


        <!-- ================= HEADER ================= -->

        <header
            class="px-5 py-5 sm:px-8 sm:py-6
            bg-[#15171c]
            border-b border-[#262a33]">

            <div class="flex flex-col items-center text-center">

                <!-- Logo -->
                <div
                    class="w-12 h-12 sm:w-14 sm:h-14
                    rounded-xl
                    bg-indigo-600
                    flex items-center justify-center
                    mb-3">

                    <svg
                        class="w-6 h-6 sm:w-7 sm:h-7"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12.5l4.5 4.5L19 7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

                </div>


                <!-- Title -->
                <h1
                    class="text-2xl sm:text-3xl
                    font-bold
                    tracking-tight
                    text-white">

                    My Todo List

                </h1>


                <p
                    class="text-slate-400
                    text-sm sm:text-base
                    mt-1">

                    Stay organized. Get things done.

                </p>

            </div>

        </header>



        <!-- ================= CONTENT ================= -->

        <div
            class="px-4 py-4 sm:px-7 sm:py-5">


            <!-- ================= ADD TASK ================= -->

            <section
                class="bg-[#1a1d24]
                border border-[#262a33]
                rounded-xl
                p-2">


                <div
                    class="flex items-center gap-2
                    bg-[#1a1d24]
                    border border-[#2a2e37]
                    rounded-lg
                    p-2
                    transition
                    focus-within:border-indigo-500">


                    <!-- Input -->
                    <input
                        type="text"
                        id="input"
                        placeholder="What needs to be done?"
                        autocomplete="off"
                        class="flex-1 min-w-0
                        bg-transparent
                        text-white
                        placeholder-slate-500
                        px-2 py-2.5
                        outline-none
                        text-sm sm:text-base">


                    <!-- //Add Button  -->
                    <button
                        id="btn"
                        type="button"
                        class="shrink-0
                        bg-indigo-600
                        hover:bg-indigo-500
                        text-white
                        font-semibold
                        px-4 sm:px-5
                        py-2.5
                        rounded-lg
                        transition
                        duration-150">

                        + Add Task

                    </button>

                </div>

            </section>

     <!-- TASK HEADER -->

            <div
                class="flex items-center
                justify-between
                mt-5 sm:mt-6
                mb-3">


                <h2
                    class="text-lg
                    font-semibold
                    text-slate-200">

                    Your Tasks

                </h2>


                <span
                    class="hidden sm:block
                    text-sm
                    text-slate-500">

                    Click Edit to modify

                </span>

            </div>



          <!-- // TASK AREA  -->

            <section
                class="bg-[#1a1d24]
                border border-[#262a33]
                rounded-xl
                overflow-hidden">


                <!-- TASK LIST -->

                <ul
                    id="ul"
                    class="p-3
                    space-y-2
                    overflow-y-auto
                    overflow-x-hidden">

                </ul>


   <!-- // EMPTY STATE  -->

                <div
                    id="emptyState"
                    class="py-12
                    px-5
                    text-center">


                    <div
                        class="w-14 h-14
                        mx-auto
                        rounded-xl
                        bg-[#1f232c]
                        border border-[#2a2e37]
                        flex items-center
                        justify-center
                        mb-4">

                        <span class="text-2xl">
                            📋
                        </span>

                    </div>


                    <h3
                        class="font-semibold
                        text-slate-300
                        text-lg">

                        No tasks yet

                    </h3>


                    <p
                        class="text-sm
                        text-slate-500
                        mt-1">

                        Add your first task above.

                    </p>

                </div>
                 </section>

<!-- //Footer  -->


            <div
                class="flex items-center
                justify-center
                gap-2
                mt-4">

                <p
                    class="text-xs sm:text-sm
                    text-slate-500">

                    Your tasks are automatically saved.

                </p>

            </div>

        </div>

    </main>

    <script src="TodoAppL2.js"></script>

</body>

</html>
