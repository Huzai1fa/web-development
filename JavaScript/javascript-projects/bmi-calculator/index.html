<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>BMI Calculator</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center px-4 py-3">

    <main class="w-full max-w-md">

        <!-- Main Heading -->
        <div class="text-center mb-3">

            <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight text-yellow-500">
                BMI Calculator
            </h1>

            <p class="text-white/80 text-sm mt-1">
                Check your Body Mass Index
            </p>

        </div>


        <!-- Calculator Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-5 md:p-6">

            <!-- Form -->
            <form id="form" class="space-y-3">

                <!-- Height -->
                <div>

                    <label
                        for="height"
                        class="block text-sm font-semibold text-gray-700 mb-1">

                        Height (cm)

                    </label>

                    <input
                        type="number"
                        id="height"
                        placeholder="Enter your height"
                        class="w-full px-3 py-2.5 rounded-xl border-2 border-gray-200
                        outline-none transition
                        focus:border-purple-500
                        focus:ring-4 focus:ring-purple-100">

                </div>


                <!-- Weight -->
                <div>

                    <label
                        for="weight"
                        class="block text-sm font-semibold text-gray-700 mb-1">

                        Weight (kg)

                    </label>

                    <input
                        type="number"
                        id="weight"
                        placeholder="Enter your weight"
                        class="w-full px-3 py-2.5 rounded-xl border-2 border-gray-200
                        outline-none transition
                        focus:border-purple-500
                        focus:ring-4 focus:ring-purple-100">

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full py-2.5 rounded-xl
                    bg-gradient-to-r from-purple-600 to-blue-600
                    text-white font-bold
                    shadow-md
                    transition duration-300
                    hover:scale-[1.02]
                    hover:shadow-lg
                    active:scale-95">

                    Calculate BMI

                </button>

            </form>


            <!-- Result Section -->
            <div class="mt-4 text-center">

                <h2 class="text-base font-bold text-gray-700 mb-2">
                    Your Result
                </h2>

                <div
                    id="result"
                    class="min-h-14 w-full
                    rounded-xl
                    bg-gray-50
                    border-2 border-dashed border-gray-300
                    flex items-center justify-center
                    text-lg font-bold text-purple-600
                    p-2">

                    Your BMI is

                </div>

            </div>


            <!-- BMI Guide -->
            <div class="mt-4">

                <h3 class="font-bold text-gray-700 mb-2 text-center">
                    BMI Guide
                </h3>


                <div class="grid grid-cols-2 gap-2 text-xs">

                    <!-- Underweight -->
                    <div class="bg-blue-50 rounded-lg p-2 text-center">

                        <span class="font-semibold text-blue-600">
                            Underweight
                        </span>

                        <p class="text-gray-500">
                            Below 18.5
                        </p>

                    </div>


                    <!-- Normal -->
                    <div class="bg-green-50 rounded-lg p-2 text-center">

                        <span class="font-semibold text-green-600">
                            Normal
                        </span>

                        <p class="text-gray-500">
                            18.5 – 24.9
                        </p>

                    </div>


                    <!-- Overweight -->
                    <div class="bg-yellow-50 rounded-lg p-2 text-center">

                        <span class="font-semibold text-yellow-600">
                            Overweight
                        </span>

                        <p class="text-gray-500">
                            25 – 29.9
                        </p>

                    </div>


                    <!-- Obese -->
                    <div class="bg-red-50 rounded-lg p-2 text-center">

                        <span class="font-semibold text-red-600">
                            Obese
                        </span>

                        <p class="text-gray-500">
                            30+
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-white/70 text-xs mt-2">
            Simple • Fast • Easy
        </p>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
